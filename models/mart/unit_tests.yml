unit_tests:
  - name: unittest_fullmoon_matcher
    model: mart_fullmoon_reviews
    given:
      - input: ref('fct_reviews')
        rows:
          - {review_date: '2019-10-12'}
          - {review_date: '2019-10-13'}
          - {review_date: '2019-10-14'}
      - input: ref('seed_full_moon_dates')
        rows:
          - {full_moon_date: '2019-10-13'}
    expect:
      rows:
        - {review_date: '2019-10-12', is_full_moon: 'not full moon'}
        - {review_date: '2019-10-13', is_full_moon: 'not full moon'}
        - {review_date: '2019-10-14', is_full_moon: 'full moon'}