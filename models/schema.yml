models:
  - name: dim_listings_cleansed
    description: "Cleansed listings data from Airbnb"
    config:
      contract:
        enforced: true
    columns:
      - name: listing_id
        description: "Primary key for the listing"
        data_type: integer
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "Foreign key referencing the host table"
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: created_at
        description: "Timestamp of when the listing was created"
        data_type: timestamp

      - name: room_type
        description: "Type of room available for booking"
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights") }}'
        data_type: integer
        data_tests:
          - positive_values

      - name: price
        description: "Price per night for the listing"
        data_type: integer
        data_tests:
          - positive_values

      - name: listing_name
        description: "Name of the listing"
        data_type: string
      - name: price
        description: "Price per night for the listing"
        data_type: integer
      - name: updated_at
        description: "Timestamp of when the listing was last updated"
        data_type: timestamp

  - name: dim_hosts_cleansed
    description: "Cleansed hosts data from Airbnb"
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Primary key for the host"
        data_type: integer
      - name: host_name
        description: "Name of the host"
        data_type: string
      - name: is_superhost
        description: "Indicates if the host is a superhost"
        data_type: boolean
      - name: updated_at
        description: "Timestamp of when the host was last updated"
        data_type: timestamp
      - name: created_at
        description: "Timestamp of when the host was created"
        data_type: timestamp